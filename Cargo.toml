[workspace]
resolver = "2"
members = [
    "cce-ui",
    "cce-core",
    "cce-screenaver",
    "cce-authenticator",
    "cce-fonts",
    "cce-system-interface",
    "cce-compositor",
    "cce-status-interface",
    "cce-mail",
    "cce-display-manager",
    "cce-designer",
    "cce-color-editor",
    "cce-cloud",
    "cce-text-editor",
    "cce-gallery",
    "cce-notifier",
    "cce-files",
    "cce-graph",
    "cce-grid",
    "cce-map",
    "cce-calendar",
    "cce-documents",
    "cce-image",
    "cce-terminal",
    "cce-browser",
    "cce-data-editor",
    "cce-remote",
    "cce-secrets",
    "cce-window-manager",
    "cce-lock",
    "cce-shortcuts-portal",
    "cce-desktop-portal",
    "cce-vault",
    "cce-notes",
    "cce-keyboard",
    "cce-weather",
    "cce-model",
    "cce-mesh-io",
    "cce-relief",
    "cce-spreadsheet",
    "cce-wpe",
    "cce-vault-web",
    "cce-sync",
    "cce-claude",
]
# Crates that live here but build on their own. cce-sync-server is a
# Cloudflare Worker (wasm32 only, built by worker-build under wrangler) that
# pins cce-sync by git rev and keeps its own Cargo.lock, which is the one a
# deploy uses; without this, cargo refuses to build it from inside this tree.
exclude = ["cce-sync-server"]

# Every app declares cce-ui (and cce-compositor also cce-window-manager) as a git
# dependency on GitHub -- the crates' origin, the one place a push lands -- so a
# standalone clone of one app resolves without sibling checkouts; that is what
# makes a single app installable on its own. (Until 2026-09-21 the pins named
# git.lucas.co, an hourly mirror of GitHub retired 2026-10-14: a rev pinned right
# after a push was not fetchable from there for up to an hour.) Inside this
# workspace those git sources are redirected back to the local crates, so
# workspace builds compile the working tree and cross-crate edits stay live.
# The pinned revs only affect builds that happen outside this workspace, which
# means they can go stale without any build here failing: after pushing cce-ui
# or cce-window-manager, run ./bump-revs.sh to repin the crates that depend on
# them (cce-vault too, pinned by cce-notes). The patch keys must match the pins' URL exactly, or the patch is unused
# and every crate silently builds a fetched copy of the toolkit.
[patch."https://github.com/lsgalante/cce-ui.git"]
cce-ui = { path = "cce-ui" }

[patch."https://github.com/lsgalante/cce-core.git"]
cce-core = { path = "cce-core" }

[patch."https://github.com/lsgalante/cce-window-manager.git"]
cce-window-manager = { path = "cce-window-manager" }

[patch."https://github.com/lsgalante/cce-vault.git"]
cce-vault = { path = "cce-vault" }

[patch."https://github.com/lsgalante/cce-mesh-io.git"]
cce-mesh-io = { path = "cce-mesh-io" }

[patch."https://github.com/lsgalante/cce-wpe.git"]
cce-wpe = { path = "cce-wpe" }

# cce-vault-web (the phone app) pins cce-sync by git rev for its standalone
# build; here it compiles the member. (cce-sync-server, excluded, keeps its
# own pin and lock.)
[patch."https://github.com/lsgalante/cce-sync.git"]
cce-sync = { path = "cce-sync" }

# A member's own [profile] is ignored in a workspace build (only the root's
# applies), so cce-compositor's `[profile.release] debug = true` never reached
# the installed cce-fx: it shipped with no debug info, and a crash backtrace
# had no file:line. Line tables are enough for that, cost a fraction of full
# debug info, and are not loaded into memory. Scoped to cce-fx so no other
# crate rebuilds.
[profile.release.package.cce-fx]
debug = "line-tables-only"
